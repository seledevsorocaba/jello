<section class="list" [attr.data-list-id]="list.id" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
  <header class="list-header">
    <h3>{{ list.title }}</h3>
    <span class="count">{{ list.cards.length }}</span>
  </header>

  <div class="cards">
    @for (card of list.cards; track card.id) {
      <app-card
        [card]="card"
        [labels]="labels"
        [users]="users"
        [listId]="list.id"
        (moveCard)="moveCard.emit({ cardId: $event.cardId, fromListId: $event.fromListId, toListId: $event.toListId })"
        (deleteCard)="deleteCard.emit({ listId: list.id, cardId: $event })"
        (toggleLabel)="toggleLabel.emit({ listId: list.id, cardId: card.id, labelId: $event })"
        (setMember)="setMember.emit({ listId: list.id, cardId: card.id, memberId: $event })"
        (editCard)="editCard.emit({ listId: list.id, cardId: card.id, title: $event.title, labelIds: $event.labelIds, memberId: $event.memberId })"
      />
    }
  </div>

  <button type="button" class="add-card" (click)="startCreate()">+ Adicionar cartão</button>

  @if (isCreating) {
    <div class="modal-backdrop" (click)="cancelCreate()">
      <div class="card-modal" (click)="$event.stopPropagation()">
        <div class="modal-header">
          @for (label of labels; track label.id) {
            @if (selectedLabelIds.includes(label.id)) {
              <span class="selected-tag" [style.background]="label.color">{{ label.name }}</span>
            }
          }
          <button type="button" class="close-button" (click)="cancelCreate()">×</button>
        </div>

        <input
          type="text"
          class="card-title-input"
          [(ngModel)]="newCardTitle"
          placeholder="Digite o título do cartão..."
          autofocus
          (keydown.enter)="submitNewCard()"
        />

        <div class="label-section">
          <span>PALAVRAS-CHAVE</span>
          <div class="keyword-list">
            @for (label of labels; track label.id) {
              <button
                type="button"
                class="keyword"
                [class.active]="selectedLabelIds.includes(label.id)"
                [style.background]="label.color"
                (click)="toggleLabelSelection(label.id)"
              >
                {{ label.name }}
              </button>
            }
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="primary-action" (click)="submitNewCard()">Adicionar cartão</button>
          <button type="button" class="secondary-action" (click)="cancelCreate()">Cancelar</button>
        </div>
      </div>
    </div>
  }
</section>
